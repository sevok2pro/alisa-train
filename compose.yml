version: "3.9"
services:
  bd:
    image: postgres:19
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_DB: main
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - 5432:5432
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080